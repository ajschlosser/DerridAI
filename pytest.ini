[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: fast deterministic tests isolated from external services
    regression: broad regression coverage retained from the existing backend suite
    contract: compatibility checks across stable application boundaries
    integration: tests that exercise multiple real application subsystems together
    characterization: behavior-preservation tests for legacy or refactoring-sensitive surfaces
    slow: intentionally expensive tests kept out of the fastest feedback subset
