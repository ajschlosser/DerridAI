services:
  api:
    build:
      context: .
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FTLANG_CACHE: /data/fasttext-langdetect
      HF_HOME: /data/huggingface
      NLTK_DATA: /data/nltk_data
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app/src
      - fasttext-cache:/data/fasttext-langdetect
      - huggingface-cache:/data/huggingface
      - nltk-cache:/data/nltk_data
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/scripts:/usr/share/nginx/html/scripts:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR}:/root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  
  # Fetch models if not present
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["sh", "-c", "ollama pull gemma4:e2b && ollama pull gemma4:e4b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"


volumes:
  fasttext-cache:
  huggingface-cache:
  nltk-cache:
  redis-data:
  ollama-data: