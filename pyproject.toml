[project]
name = "derridai"
version = "0.58.5"
description = "DerridAI — evidence-grounded scholarly research, provenance, retrieval, and RAG evaluation"
requires-python = ">=3.10"
dependencies = [
    "dl_translate",
    "cupy-cuda12x>=12.0.0",
    "fastapi",
    "nltk",
    "pydantic",
    "uvicorn",
    "fast_langdetect",
    "langchain_chroma",
    "langchain_ollama",
    "langchain_core",
    "keybert",
    "redis[hiredis]>=5.0.0",
    "sentence_transformers",
    "spacy[cuda12x]",
    "textblob",
    "json-repair",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "fr_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl"
]

[tool.poetry]
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"
spacy = "^3.7.5"
cupy-cuda12x = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.2.0"

[tool.spacy]
languages = ["en_core_web_lg", "fr_core_news_lg"]
