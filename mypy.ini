[mypy]
python_version = 3.12
files = api/app
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False
# Type-check function bodies even when signatures are still incomplete.
# SA-02: existing optional/dictionary payloads need explicit schemas before
# strict optional checking is enabled. New extracted modules override below.
check_untyped_defs = True
strict_optional = False
allow_redefinition = True
show_error_codes = True
warn_unused_ignores = True

[mypy-app.corpus_metadata]
strict_optional = True

[mypy-app.corpus_pipeline,app.corpus_publication]
strict_optional = True
