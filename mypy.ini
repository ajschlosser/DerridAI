[mypy]
python_version = 3.12
files = api/app
ignore_missing_imports = True
follow_imports = silent
disallow_untyped_defs = False
# SA-02: existing optional/dictionary payloads need explicit schemas before
# strict optional checking is enabled. New extracted modules override below.
strict_optional = False
allow_redefinition = True
show_error_codes = True
warn_unused_ignores = True

# SA-03: Pydantic literal-list factory inference, not validation bypasses.
[mypy-app.models]
disable_error_code = arg-type

# SA-04: lazy Chroma clients and heterogeneous result accumulators.
[mypy-app.chroma_store]
disable_error_code = assignment,misc,no-redef,var-annotated

# SA-05: dynamic query/evidence payloads pending TypedDict contracts.
[mypy-app.rag]
disable_error_code = arg-type,operator

# SA-06: provider/catalog JSON at external boundaries.
[mypy-app.llm_tools]
disable_error_code = arg-type,union-attr

# SA-07: staged Pydantic schemas and heterogeneous checkpoint payloads.
[mypy-app.corpus_builder]
disable_error_code = arg-type,var-annotated

# SA-08: list() methods shadow builtin type names; mixin owns runtime locks.
[mypy-app.jobs]
disable_error_code = valid-type,attr-defined

# SA-09: invariant list[Literal] to list[str] at language-store boundaries.
[mypy-app.main]
disable_error_code = arg-type
