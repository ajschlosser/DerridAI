query SourceDocumentInspector($source_document_id: String!) {
  source_document(source_document_id: $source_document_id) {
    source_document_id
    sha256
    filename
    created_at
    media_type
    media_kind
    content_suffix
    source_url
    page_count
    source_unit_count
    ocr_pages
    derived_from_source_document_id
    extraction_provenance
    catalog_metadata
    initial_metadata
    captures {
      capture_id
      candidate_id
      provider
      provider_item_id
      discovery_method
      discovered_at
      acquired_at
      author_name
    }
    builds {
      build_id
      status
      created_at
      record_count
    }
  }
}
