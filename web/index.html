<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DerridAI - Ask Jackie Anything</title>
  <style>
    :root {
      --bg: #e9f0ed;
      --surface: #fffefa;
      --surface-muted: #f4f7f2;
      --text: #17241f;
      --muted: #52625a;
      --border: #cbd8d0;
      --accent: #006b5b;
      --accent-hover: #005246;
      --accent-soft: #d5ede5;
      --focus-ring: #005fcc;
      --error: #9a2436;
      --error-bg: #fdebee;
      --shadow: 0 16px 38px rgba(24, 47, 37, 0.1);
      --radius: 0.5rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(23, 36, 31, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(23, 36, 31, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      color: var(--text);
      font-family: "Aptos", "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1,
    h2 {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Visible focus indicator for all interactive elements (WCAG 2.4.7) */
    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--surface);
      color: var(--text);
      padding: 0.75em 1.25em;
      z-index: 100;
      border-radius: 0 0 var(--radius) 0;
      font-weight: 600;
    }

    .skip-link:focus {
      left: 0;
      top: 0;
    }

    header {
      max-width: 68rem;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.75rem;
      letter-spacing: 0;
      color: var(--accent);
    }

    header p {
      max-width: 34rem;
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    main {
      max-width: 68rem;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    #query-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.4em;
      font-size: 1.05rem;
    }

    .hint {
      font-size: 0.9em;
      color: var(--muted);
      margin: 0.5em 0 1em;
    }

    textarea {
      font: inherit;
      width: 100%;
      min-height: 9rem;
      padding: 0.9em 1em;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      background: var(--surface-muted);
      color: var(--text);
      resize: vertical;
    }

    textarea:hover {
      border-color: #8ba99a;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 0.75em;
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 0.35rem;
      padding: 0.7em 1.5em;
      background: var(--accent);
      color: #ffffff;
      min-height: 44px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2.4s;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status-message {
      min-height: 1.5em;
      color: var(--muted);
      font-weight: 600;
    }

    #error-message {
      min-height: 1.5em;
      color: var(--error);
      font-weight: 600;
    }

    #error-message:not(:empty) {
      background: var(--error-bg);
      border: 1px solid var(--error);
      border-radius: 0.35rem;
      padding: 0.75em 1em;
    }

    section {
      margin-top: 1.5rem;
    }

    #result-heading {
      font-size: 1.5rem;
      margin: 0;
    }

    .results-toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .results-filter {
      flex: 1 1 16rem;
      max-width: 28rem;
    }

    .results-filter label {
      margin-bottom: 0.2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .results-filter input {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    .results-filter input:focus {
      border-color: var(--accent);
    }

    .clear-history-button {
      min-height: 2.75rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
    }

    .clear-history-button:hover {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    #result-cards {
      display: grid;
      gap: 1rem;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 6px 18px rgba(24, 47, 37, 0.07);
      animation: result-appear 220ms ease-out;
    }

    .result-card__summary {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      list-style: none;
    }

    .result-card__summary::-webkit-details-marker {
      display: none;
    }

    .result-card__summary::before {
      content: "+";
      display: grid;
      line-height: 1;
      width: 1.4rem;
      height: 1.4rem;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font-weight: 700;
    }

    details[open] > .result-card__summary::before {
      content: "-";
    }

    .result-card__question {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .result-card__body {
      margin-top: 1.25rem;
    }

    .result-card__content > :first-child {
      margin-top: 0;
    }

    .result-card__content > :last-child {
      margin-bottom: 0;
    }

    .result-card__content h3 {
      margin: 1.5rem 0 0.6rem;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
    }

    .result-card__content p {
      margin: 0 0 0.9rem;
      max-width: 78ch;
    }

    .result-card__content ol,
    .result-card__content ul {
      margin: 0.75rem 0;
      padding-left: 1.4rem;
    }

    .result-card__content li + li {
      margin-top: 0.45rem;
    }

    .result-card__content em {
      color: var(--muted);
    }

    .result-card__content strong {
      color: var(--text);
    }

    .result-card__details {
      margin-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .result-card__details > summary {
      padding: 0.75rem 0;
      cursor: pointer;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .result-card__details > summary:focus-visible,
    .result-card__summary:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .works-cited {
      margin-top: 1.5rem;
      max-width: 52rem;
    }

    .works-cited__list {
      display: grid;
      gap: 0.75rem;
      margin: 0 0 0.75rem;
      padding: 1rem 1.25rem 1rem 2.25rem;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0.25rem;
      background: #fbfcf8;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .works-cited__list li {
      padding-left: 0.25rem;
    }

    .works-cited__list li + li {
      margin: 0;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .metadata-list {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.45rem 1rem;
      margin: 0;
      padding: 1rem;
      background: var(--surface-muted);
      font-size: 0.9rem;
    }

    .metadata-list dt {
      color: var(--muted);
      font-weight: 700;
    }

    .metadata-list dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 40rem) {
      .results-toolbar {
        display: grid;
        align-items: stretch;
      }

      .results-filter {
        max-width: none;
      }

      .clear-history-button {
        width: 100%;
      }

      .metadata-list {
        grid-template-columns: 1fr;
        gap: 0.2rem;
      }

      .metadata-list dd {
        margin-bottom: 0.6rem;
      }
    }

    @keyframes result-appear {
      from {
        opacity: 0;
        transform: translateY(0.5rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 40rem) {
      header {
        padding-top: 2.25rem;
      }

      header h1 {
        font-size: 2.2rem;
      }

      main,
      header {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      #query-form,
      .result-card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <h1>DerridAI</h1>
    <p>Research notes and responses on the work of Jacques Derrida.</p>
  </header>
  <main id="main-content">
    <form id="query-form">
      <label for="prompt-input">Your question</label>
      <textarea
        id="prompt-input"
        rows="4"
        cols="60"
        required
        aria-describedby="prompt-hint"
      ></textarea>
      <p id="prompt-hint" class="hint">Ask about a concept, text, or question in Derrida's work.</p>
      <div class="submit-row">
        <button type="submit" id="submit-button">Ask DerridAI</button>
        <span class="spinner" id="loading-spinner" hidden aria-hidden="true"></span>
      </div>
    </form>
    <p id="status-message" role="status" aria-live="polite"></p>
    <div id="error-message" role="alert" aria-live="assertive"></div>
    <section id="results-section" aria-labelledby="result-heading" hidden>
      <div class="results-toolbar">
        <h2 id="result-heading">Results</h2>
        <div class="results-filter">
          <label for="results-filter-input">Filter saved results</label>
          <input id="results-filter-input" type="search" placeholder="Search questions and responses" autocomplete="off" />
        </div>
        <button type="button" id="clear-history-button" class="clear-history-button">Clear history</button>
      </div>
      <div id="result-cards" aria-live="polite"></div>
    </section>
  </main>
  <script src="/scripts/derridai.js"></script>
</body>
</html>
