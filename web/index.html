<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DerridAI - Ask Jackie Anything</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: #ffffff;
      --text: #1c1a17;
      --muted: #55524c;
      --border: #ddd6c7;
      --accent: #453a73;
      --accent-hover: #322a55;
      --focus-ring: #005fcc;
      --error: #8a1f2b;
      --error-bg: #fbe9eb;
      --radius: 0.75rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    h1,
    h2 {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Visible focus indicator for all interactive elements (WCAG 2.4.7) */
    a:focus-visible,
    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--surface);
      color: var(--text);
      padding: 0.75em 1.25em;
      z-index: 100;
      border-radius: 0 0 var(--radius) 0;
      font-weight: 600;
    }

    .skip-link:focus {
      left: 0;
      top: 0;
    }

    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.75rem);
      color: var(--accent);
    }

    header p {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    #query-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: 0 6px 20px rgba(28, 26, 23, 0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.4em;
      font-size: 1.05rem;
    }

    .hint {
      font-size: 0.9em;
      color: var(--muted);
      margin: 0.5em 0 1em;
    }

    textarea {
      font: inherit;
      width: 100%;
      padding: 0.75em;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 0.75em;
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 0.5rem;
      padding: 0.7em 1.5em;
      background: var(--accent);
      color: #ffffff;
      min-height: 44px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2.4s;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status-message {
      min-height: 1.5em;
      color: var(--muted);
      font-weight: 600;
    }

    #error-message {
      min-height: 1.5em;
      color: var(--error);
      font-weight: 600;
    }

    #error-message:not(:empty) {
      background: var(--error-bg);
      border: 1px solid var(--error);
      border-radius: 0.5rem;
      padding: 0.75em 1em;
    }

    section {
      margin-top: 1.5rem;
    }

    #result-heading {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    #result-cards {
      display: grid;
      gap: 1rem;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 0.5rem;
      padding: 1.25rem;
      box-shadow: 0 4px 14px rgba(28, 26, 23, 0.05);
      animation: result-appear 220ms ease-out;
    }

    .result-card__question {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .result-card__content > :first-child {
      margin-top: 0;
    }

    .result-card__content > :last-child {
      margin-bottom: 0;
    }

    .result-card__content h3 {
      margin: 1.5rem 0 0.6rem;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
    }

    .result-card__content p {
      margin: 0 0 0.9rem;
    }

    .result-card__content ol,
    .result-card__content ul {
      margin: 0.75rem 0;
      padding-left: 1.4rem;
    }

    .result-card__content li + li {
      margin-top: 0.45rem;
    }

    .result-card__content em {
      color: var(--muted);
    }

    @keyframes result-appear {
      from {
        opacity: 0;
        transform: translateY(0.5rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <h1>DerridAI</h1>
    <p>Ask Jackie anything about his work.</p>
  </header>
  <main id="main-content">
    <form id="query-form">
      <label for="prompt-input">Ask Jackie a question...</label>
      <textarea
        id="prompt-input"
        rows="4"
        cols="60"
        required
        aria-describedby="prompt-hint"
      ></textarea>
      <p id="prompt-hint" class="hint">Describe your question, then select Submit query.</p>
      <div class="submit-row">
        <button type="submit" id="submit-button">Submit query</button>
        <span class="spinner" id="loading-spinner" hidden aria-hidden="true"></span>
      </div>
    </form>
    <p id="status-message" role="status" aria-live="polite"></p>
    <div id="error-message" role="alert" aria-live="assertive"></div>
    <section aria-labelledby="result-heading">
      <h2 id="result-heading">Results</h2>
      <div id="result-cards" aria-live="polite"></div>
    </section>
  </main>
  <script src="/scripts/derridai.js"></script>
</body>
</html>
