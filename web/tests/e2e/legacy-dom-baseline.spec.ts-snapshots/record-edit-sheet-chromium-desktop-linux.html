<dialog class="record-edit-sheet" aria-labelledby="recordEditTitle" open="">
<form method="dialog">
<header class="record-edit-head">
<div>
<p>Record metadata</p>
<h2 id="recordEditTitle">Edit record</h2>
<span>No unsaved changes</span>
</div>
<button type="button" class="record-sheet-close" aria-label="Close">×</button>
</header>
<div class="record-edit-body">
<fieldset class="record-edit-group">
<legend>Source</legend>
<div class="record-edit-grid">
<label class="">
<span>Record Id</span>
<input type="text" value="derrida-grammatology-00001">
<!---->
</label>
<label class="">
<span>Work</span>
<input type="text" value="Of Grammatology">
<!---->
</label>
<label class="">
<span>Document Author</span>
<input type="text" value="Jacques Derrida">
<!---->
</label>
<label class="">
<span>Year</span>
<input type="number" value="1967">
<!---->
</label>
<label class="">
<span>Page Start</span>
<input type="number" value="3">
<!---->
</label>
<label class="">
<span>Page End</span>
<input type="number" value="3">
<!---->
</label>
</div>
</fieldset>
<fieldset class="record-edit-group">
<legend>Discourse</legend>
<div class="record-edit-grid">
<label class="">
<span>Speaker</span>
<input type="text" value="Derrida">
<!---->
</label>
</div>
</fieldset>
<fieldset class="record-edit-group">
<legend>Indexing</legend>
<div class="record-edit-grid">
<label class="">
<span>Topics</span>
<input type="text" value="sign, presence">
<small>Separate multiple values with commas.</small>
</label>
<label class="">
<span>Concepts</span>
<input type="text" value="logocentrism">
<small>Separate multiple values with commas.</small>
</label>
</div>
</fieldset>
<fieldset class="record-edit-group">
<legend>Quality &amp; review</legend>
<div class="record-edit-grid">
<label class="">
<span>Needs Review</span>
<select value="false">
<option value="">Not set</option>
<option value="true">Yes</option>
<option value="false">No</option>
</select>
<!---->
</label>
</div>
</fieldset>
<fieldset class="record-edit-group">
<legend>Text</legend>
<div class="record-edit-grid">
<label class="record-edit-wide">
<span>Text</span>
<textarea rows="12" value="The sign and divinity have the same place and time of birth.">
</textarea>
<!---->
</label>
</div>
</fieldset>
<!---->
</div>
<footer class="record-edit-actions">
<div>
<button type="button" class="record-reset" disabled="">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M20 11a8 8 0 0 0-14.8-4L3 10">
</path>
<path d="M3 4v6h6">
</path>
<path d="M4 13a8 8 0 0 0 14.8 4L21 14">
</path>
<path d="M21 20v-6h-6">
</path>
</svg>Reset</button>
<span>Only changed fields will be saved and added to the audit trail.</span>
</div>
<div>
<button type="button" class="record-cancel">Cancel</button>
<button type="submit" class="record-save" disabled="">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M4 20h4l11-11-4-4L4 16v4Z">
</path>
<path d="m13.5 6.5 4 4">
</path>
</svg>Save</button>
</div>
</footer>
</form>
</dialog>
