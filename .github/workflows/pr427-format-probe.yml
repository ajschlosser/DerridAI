name: PR427 temporary formatter

on:
  push:
    branches:
      - cursor/ci-merge-readiness-preflight

permissions:
  contents: read

jobs:
  format-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Format changed frontend files
        run: |
          ./web/node_modules/.bin/prettier \
            web/src/api/corpus/types.ts \
            web/src/components/CorpusMetadataResolutionPanel.vue \
            web/src/components/PdfCorpusBuilder.vue \
            --write --config web/.prettierrc
      - name: Emit formatted files
        shell: bash
        run: |
          for file in \
            web/src/api/corpus/types.ts \
            web/src/components/CorpusMetadataResolutionPanel.vue \
            web/src/components/PdfCorpusBuilder.vue
          do
            key=$(echo "$file" | tr '/.' '__')
            echo "PR427_BEGIN_${key}"
            base64 -w0 "$file"
            echo
            echo "PR427_END_${key}"
          done
