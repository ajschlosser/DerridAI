name: Spec format helper

on:
  push:
    branches:
      - docs/sync-core-spec-1.0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-core-spec-1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write ../SPECIFICATION.md --config .prettierrc
      - name: Commit formatted specification
        working-directory: .
        run: |
          if git diff --quiet -- SPECIFICATION.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPECIFICATION.md
          git commit -m "Format specification with Prettier"
          git push origin HEAD:docs/sync-core-spec-1.0
