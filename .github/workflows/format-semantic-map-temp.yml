name: Temporary semantic map formatter

on:
  push:
    branches:
      - feature/semantic-map-workspace-ux

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/semantic-map-workspace-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Format semantic map files
        working-directory: web
        run: >-
          npx prettier --write
          src/components/semantic/SemanticMapCanvas.vue
          src/components/semantic/SemanticMapFrame.vue
          src/domain/semanticMap.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/semantic/SemanticMapCanvas.vue web/src/components/semantic/SemanticMapFrame.vue web/src/domain/semanticMap.ts
          git commit -m "Format semantic map workspace files"
          git push origin HEAD:feature/semantic-map-workspace-ux
