name: DerridAI quality gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - ".prettierignore"
      - ".editorconfig"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
  push:
    branches: [master]
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - ".prettierignore"
      - ".editorconfig"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
      format: ${{ steps.filter.outputs.format }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            echo "format=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          backend=false
          frontend=false
          contract=false
          format=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/frontend.yml|scripts/*)
                backend=true
                frontend=true
                contract=true
                format=true
                ;;
              api/*)
                backend=true
                contract=true
                ;;
              tests/test_frontend_api_contract.py|pytest.ini)
                backend=true
                contract=true
                ;;
              tests/*|ruff.toml|mypy.ini)
                backend=true
                ;;
              web/src/api/*)
                frontend=true
                contract=true
                ;;
              web/*)
                frontend=true
                format=true
                ;;
              README.md|CONTRIBUTING.md|AGENTS.md|docs/*|.prettierignore|.editorconfig)
                format=true
                ;;
            esac

            # Prettier owns supported text formats across the repository, not
            # only files under web/. Keep this separate from domain ownership
            # above so e.g. api/README.md and JSON fixtures still get checked.
            case "$path" in
              *.md|*.json|*.yml|*.yaml|*.js|*.mjs|*.cjs|*.ts|*.tsx|*.vue|*.css|*.scss|*.html)
                format=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "format=$format" >> "$GITHUB_OUTPUT"

  format-check:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:repo:check

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check api/app tests scripts/check_frontend_api_contract.py

  backend-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy only
        run: pip install mypy==2.3.1
      - run: mypy

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies without optional reranker
        run: |
          grep -vE '^sentence-transformers' api/requirements.txt > /tmp/derridai-test-requirements.txt
          pip install -r /tmp/derridai-test-requirements.txt "pytest>=9,<10" "pytest-xdist>=3.8,<4"
      - name: Python syntax
        run: python -m compileall -q api/app
      - name: Backend and release regression tests
        run: pytest -q -n auto --dist=worksteal --ignore=tests/test_frontend_api_contract.py

  api-contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API contract dependencies
        run: |
          grep -vE '^sentence-transformers' api/requirements.txt > /tmp/derridai-contract-requirements.txt
          pip install -r /tmp/derridai-contract-requirements.txt "pytest>=9,<10"
      - name: Frontend / FastAPI contract
        run: pytest -q -m contract tests/test_frontend_api_contract.py

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck application
        run: npm run typecheck
      - name: Typecheck tests and test configuration
        run: npm run typecheck:tests
      - name: Unit/component tests
        run: npm run test:unit
      - name: Production build
        run: npm run build:ci
      - name: Storybook build
        run: npm run build-storybook

  frontend-legacy:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend-legacy (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build:ci
      - name: Legacy DOM regression tests
        run: npm run test:e2e:legacy -- --shard=${{ matrix.shard }}

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend-e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Save Playwright Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == '1/2'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Build production app
        run: npm run build:ci
      - name: Build Storybook
        run: npm run build-storybook
      - name: Composed UI and WCAG 2.2 AA tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

  frontend-a11y:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend-a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: Corpus Builder WCAG 2.2 AA sweep
        run: npm run test:e2e:a11y

  # Preserve the historical required-check name while allowing unrelated
  # backend-only changes to skip all frontend compute.
  frontend:
    name: frontend
    if: always()
    needs:
      - changes
      - format-check
      - api-contract
      - frontend-lint
      - frontend-static
      - frontend-legacy
      - frontend-e2e
      - frontend-a11y
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend gates
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FORMAT_CHANGED: ${{ needs.changes.outputs.format }}
          FORMAT_RESULT: ${{ needs.format-check.result }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract }}
          CONTRACT_RESULT: ${{ needs.api-contract.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          STATIC_RESULT: ${{ needs.frontend-static.result }}
          LEGACY_RESULT: ${{ needs.frontend-legacy.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          A11Y_RESULT: ${{ needs.frontend-a11y.result }}
        run: |
          if [ "$FORMAT_CHANGED" = "true" ] && [ "$FORMAT_RESULT" != "success" ]; then
            echo "The repository formatting gate did not succeed: $FORMAT_RESULT"
            exit 1
          fi

          if [ "$CONTRACT_CHANGED" = "true" ] && [ "$CONTRACT_RESULT" != "success" ]; then
            echo "The frontend/backend API contract gate did not succeed: $CONTRACT_RESULT"
            exit 1
          fi

          if [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "No frontend-relevant changes; browser/frontend gates were skipped."
            exit 0
          fi

          for result in "$LINT_RESULT" "$STATIC_RESULT" "$LEGACY_RESULT" "$E2E_RESULT" "$A11Y_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A frontend quality gate did not succeed: $result"
              exit 1
            fi
          done
