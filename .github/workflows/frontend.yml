name: DerridAI quality gates

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"
  push:
    branches: [master]
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check api/app tests

  backend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: mypy

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  backend:
    runs-on: ubuntu-latest
    env:
      CHROMA_DATA_ROOT: /tmp/derridai-data
      CHROMA_PATH: /tmp/derridai-data/chroma
      AUTH_DB_PATH: /tmp/derridai-data/.home/derridai-auth.sqlite3
      SYSTEM_DB_PATH: /tmp/derridai-data/.home/derridai-system.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest
      - name: Python syntax
        run: python -m compileall -q api/app
      - name: Backend and release regression tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit/component tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Storybook build
        run: npm run build-storybook
      - name: Composed UI, opacity, and WCAG 2.0 AA tests
        run: npm run test:e2e
