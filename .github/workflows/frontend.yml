name: DerridAI quality gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - ".prettierignore"
      - ".editorconfig"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
  push:
    branches: [master]
    paths:
      - "api/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
      - "ruff.toml"
      - "mypy.ini"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - ".prettierignore"
      - ".editorconfig"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_unit: ${{ steps.filter.outputs.frontend_unit }}
      unit_shards: ${{ steps.filter.outputs.unit_shards }}
      frontend_build: ${{ steps.filter.outputs.frontend_build }}
      storybook: ${{ steps.filter.outputs.storybook }}
      e2e: ${{ steps.filter.outputs.e2e }}
      a11y: ${{ steps.filter.outputs.a11y }}
      a11y_scope: ${{ steps.filter.outputs.a11y_scope }}
      legacy: ${{ steps.filter.outputs.legacy }}
      sdk: ${{ steps.filter.outputs.sdk }}
      contract: ${{ steps.filter.outputs.contract }}
      format: ${{ steps.filter.outputs.format }}
      publication: ${{ steps.filter.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BACKEND=true
            FRONTEND=true
            FRONTEND_UNIT=true
            FRONTEND_BUILD=true
            STORYBOOK=true
            E2E=true
            A11Y=true
            A11Y_FULL=true
            LEGACY=true
            SDK=true
            CONTRACT=true
            FORMAT=true
            PUBLICATION=true
            UNIT_FULL=true
            UNIT_SHARDS='["1/2","2/2"]'
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/derridai-changed-paths
            PLAN=$(python3 scripts/preflight_plan.py --format shell < /tmp/derridai-changed-paths)
            eval "$PLAN"

            # Keep merge-to-master exhaustive without making every PR pay for every browser catalogue.
            if [ "$EVENT_NAME" = "push" ] && [ "$FRONTEND_BUILD" = true ]; then
              STORYBOOK=true
              E2E=true
              LEGACY=true
              A11Y=true
            fi
            if [ "$EVENT_NAME" = "push" ] && [ "$A11Y" = true ]; then
              A11Y_FULL=true
            fi
            if [ "$EVENT_NAME" = "push" ] || [ "$UNIT_FULL" = true ]; then
              UNIT_SHARDS='["1/2","2/2"]'
            else
              UNIT_SHARDS='["related"]'
            fi
          fi

          A11Y_SCOPE=skip
          if [ "$A11Y" = true ]; then
            if [ "$A11Y_FULL" = true ]; then A11Y_SCOPE=full; else A11Y_SCOPE=representative; fi
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "frontend_unit=$FRONTEND_UNIT" >> "$GITHUB_OUTPUT"
          echo "unit_shards=$UNIT_SHARDS" >> "$GITHUB_OUTPUT"
          echo "frontend_build=$FRONTEND_BUILD" >> "$GITHUB_OUTPUT"
          echo "storybook=$STORYBOOK" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          echo "a11y_scope=$A11Y_SCOPE" >> "$GITHUB_OUTPUT"
          echo "legacy=$LEGACY" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "contract=$CONTRACT" >> "$GITHUB_OUTPUT"
          echo "format=$FORMAT" >> "$GITHUB_OUTPUT"
          echo "publication=$PUBLICATION" >> "$GITHUB_OUTPUT"

  format-check:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check changed Prettier-managed files
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            cd web
            npm run format:repo:check
            exit 0
          fi

          # Deleted files cannot be formatted; exclude them before passing paths to Prettier.
          git diff --name-only --diff-filter=ACMRTUXB -z "$BASE_SHA" "$HEAD_SHA" -- \
            '*.md' '*.json' '*.yml' '*.yaml' '*.js' '*.mjs' '*.cjs' \
            '*.ts' '*.tsx' '*.vue' '*.css' '*.scss' '*.html' \
            | xargs -0 --no-run-if-empty ./web/node_modules/.bin/prettier \
              --check --config web/.prettierrc --ignore-path .prettierignore --ignore-unknown

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install ruff==0.16.8
      - run: ruff check api/app tests scripts/check_frontend_api_contract.py scripts/check_frontend_graphql_contract.py

  backend-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install mypy (plus Strawberry, whose decorators define GraphQL type signatures)
        run: pip install mypy==2.3.1 "strawberry-graphql>=0.327,<0.328"
      - run: mypy

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install backend test dependencies without optional reranker
        run: |
          grep -vE '^sentence-transformers' api/requirements.txt > /tmp/derridai-test-requirements.txt
          pip install -r /tmp/derridai-test-requirements.txt "pytest>=9,<10" "pytest-xdist>=3.8,<4"
      - name: Python syntax
        run: python -m compileall -q api/app
      - name: Backend and release regression tests
        run: pytest -q -n auto --dist=worksteal --ignore=tests/test_frontend_api_contract.py --ignore=tests/test_frontend_graphql_contract.py

  api-contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API contract dependencies
        run: |
          grep -vE '^sentence-transformers' api/requirements.txt > /tmp/derridai-contract-requirements.txt
          pip install -r /tmp/derridai-contract-requirements.txt "pytest>=9,<10"
      - name: Frontend / FastAPI contract
        run: pytest -q -m contract tests/test_frontend_api_contract.py
      - name: Frontend / GraphQL operation contract
        run: pytest -q -m contract tests/test_frontend_graphql_contract.py

  frontend-static:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck application
        run: npm run typecheck:app
      - name: Typecheck published-site Vue sources
        run: npm run typecheck:site
      - name: Typecheck tests and test configuration
        run: npm run typecheck:tests
      - name: Guard legacy snapshot ownership
        if: needs.changes.outputs.legacy == 'true'
        run: npm run check:legacy-snapshots

  frontend-unit:
    needs: changes
    if: needs.changes.outputs.frontend_unit == 'true'
    name: frontend-unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Related unit/component tests
        if: matrix.shard == 'related'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/run_frontend_related_tests.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Full unit/component test shard
        if: matrix.shard != 'related'
        run: npm run test:unit -- --shard=${{ matrix.shard }}

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend_build == 'true'
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app once
        run: npm run build:app:ci
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-${{ github.run_id }}
          path: web/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  frontend-sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    name: frontend-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate SDK browser distribution and package consumer
        run: npm run build:sdk:ci

  frontend-storybook:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    name: frontend-storybook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Storybook once
        run: npm run build-storybook
      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-storybook-${{ github.run_id }}
          path: web/storybook-static
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  frontend-legacy:
    needs: [changes, frontend-build]
    if: needs.changes.outputs.legacy == 'true'
    name: frontend-legacy (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-${{ github.run_id }}
          path: web/dist
      - name: Legacy DOM regression tests
        run: npm run test:e2e:legacy -- --shard=${{ matrix.shard }}

  frontend-e2e:
    needs: [changes, frontend-build, frontend-storybook]
    if: needs.changes.outputs.e2e == 'true'
    name: frontend-e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Save Playwright Chromium cache
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.shard == '1/2'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-${{ github.run_id }}
          path: web/dist
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: frontend-storybook-${{ github.run_id }}
          path: web/storybook-static
      - name: Composed UI and WCAG 2.2 AA tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

  frontend-a11y:
    needs: [changes, frontend-storybook]
    if: needs.changes.outputs.a11y == 'true'
    name: frontend-a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: frontend-storybook-${{ github.run_id }}
          path: web/storybook-static
      - name: Corpus Builder WCAG 2.2 AA sweep
        env:
          DERRIDAI_A11Y_SCOPE: ${{ needs.changes.outputs.a11y_scope }}
        run: npm run test:e2e:a11y

  publication-artifacts:
    needs: changes
    if: needs.changes.outputs.publication == 'true'
    name: publication-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install publication acceptance dependencies
        run: |
          grep -vE '^sentence-transformers' api/requirements.txt > /tmp/derridai-publication-requirements.txt
          pip install -r /tmp/derridai-publication-requirements.txt
          cd web
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build:sdk
          npm run build:site
      - name: Upload generated published-site bundle
        uses: actions/upload-artifact@v4
        with:
          name: published-site-runtime-${{ github.run_id }}
          path: api/app/site_assets/derridai-site.js
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Generate real publication artifacts
        run: python scripts/build_publication_acceptance_fixtures.py .tmp/publication-acceptance
      - name: Exercise single-file publication from file protocol
        working-directory: web
        env:
          DERRIDAI_PUBLICATION_FIXTURE_DIR: ../.tmp/publication-acceptance
        run: npx playwright test -c playwright.publication.config.ts
      - name: Build and run generated nginx publication
        env:
          DERRIDAI_SITE_PORT: "18080"
          DERRIDAI_SITE_IMAGE: derridai-publication-acceptance-${{ github.run_id }}
          DERRIDAI_SITE_CONTAINER: derridai-publication-acceptance-${{ github.run_id }}
        run: sh scripts/check_publication_artifacts.sh .tmp/publication-acceptance

  # Preserve the historical required-check name while allowing unrelated
  # surfaces to skip expensive compute without weakening the checks that own them.
  frontend:
    name: frontend
    if: always()
    needs:
      - changes
      - format-check
      - api-contract
      - frontend-lint
      - frontend-static
      - frontend-unit
      - frontend-build
      - frontend-sdk
      - frontend-storybook
      - frontend-legacy
      - frontend-e2e
      - frontend-a11y
      - publication-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend gates
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          UNIT_CHANGED: ${{ needs.changes.outputs.frontend_unit }}
          BUILD_CHANGED: ${{ needs.changes.outputs.frontend_build }}
          SDK_CHANGED: ${{ needs.changes.outputs.sdk }}
          STORYBOOK_CHANGED: ${{ needs.changes.outputs.storybook }}
          LEGACY_CHANGED: ${{ needs.changes.outputs.legacy }}
          E2E_CHANGED: ${{ needs.changes.outputs.e2e }}
          A11Y_CHANGED: ${{ needs.changes.outputs.a11y }}
          FORMAT_CHANGED: ${{ needs.changes.outputs.format }}
          FORMAT_RESULT: ${{ needs.format-check.result }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract }}
          CONTRACT_RESULT: ${{ needs.api-contract.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          STATIC_RESULT: ${{ needs.frontend-static.result }}
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          SDK_RESULT: ${{ needs.frontend-sdk.result }}
          STORYBOOK_RESULT: ${{ needs.frontend-storybook.result }}
          LEGACY_RESULT: ${{ needs.frontend-legacy.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          A11Y_RESULT: ${{ needs.frontend-a11y.result }}
          PUBLICATION_CHANGED: ${{ needs.changes.outputs.publication }}
          PUBLICATION_RESULT: ${{ needs.publication-artifacts.result }}
        run: |
          require_gate() {
            flag=$1
            result=$2
            label=$3
            if [ "$flag" = "true" ] && [ "$result" != "success" ]; then
              echo "$label did not succeed: $result"
              exit 1
            fi
          }

          require_gate "$FORMAT_CHANGED" "$FORMAT_RESULT" "repository formatting gate"
          require_gate "$CONTRACT_CHANGED" "$CONTRACT_RESULT" "frontend/backend API contract gate"
          require_gate "$PUBLICATION_CHANGED" "$PUBLICATION_RESULT" "publication artifact acceptance gate"

          if [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "No frontend-relevant changes; browser/frontend gates were skipped."
            exit 0
          fi

          require_gate true "$LINT_RESULT" "frontend lint"
          require_gate true "$STATIC_RESULT" "frontend static checks"
          require_gate "$UNIT_CHANGED" "$UNIT_RESULT" "frontend unit tests"
          require_gate "$BUILD_CHANGED" "$BUILD_RESULT" "production app build"
          require_gate "$SDK_CHANGED" "$SDK_RESULT" "SDK distribution/package checks"
          require_gate "$STORYBOOK_CHANGED" "$STORYBOOK_RESULT" "Storybook build"
          require_gate "$LEGACY_CHANGED" "$LEGACY_RESULT" "legacy browser characterization"
          require_gate "$E2E_CHANGED" "$E2E_RESULT" "composed browser workflows"
          require_gate "$A11Y_CHANGED" "$A11Y_RESULT" "accessibility browser sweep"
