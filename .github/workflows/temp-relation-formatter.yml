# Copyright 2026 Aaron John Schlosser, PhD.
name: Temporary relation formatter

on:
  push:
    branches:
      - task/graph-normalization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/graph-normalization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run format:repo
        working-directory: web
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Aaron Schlosser, PhD"
          git config user.email "aaron@aaronschlosser.com"
          git add -A
          git commit -m "chore: format relation normalization changes"
          git push origin HEAD:task/graph-normalization
