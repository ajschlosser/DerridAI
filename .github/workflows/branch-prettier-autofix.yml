name: Branch Prettier autofix

on:
  push:
    branches:
      - task/tooltips-help

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/tooltips-help
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Format repository
        working-directory: web
        run: npm run format:repo
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm -f .github/workflows/branch-prettier-autofix.yml
          git config user.name "Aaron Schlosser, PhD"
          git config user.email "aaron@aaronschlosser.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format tooltip audit changes"
          git push origin HEAD:task/tooltips-help
