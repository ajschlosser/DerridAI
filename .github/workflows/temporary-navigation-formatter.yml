name: Temporary navigation formatter

on:
  push:
    branches:
      - feature/navigation-ia
    paths:
      - ".github/workflows/temporary-navigation-formatter.yml"
      - "web/src/App.vue"
      - "web/src/components/shell/NavigationCommandPalette.vue"
      - "web/src/components/shell/SidebarUtilityNav.vue"
      - "web/src/domain/navigation.ts"
      - "web/src/runtime/runtime.js"
      - "web/tests/frontend/sidebar-startup.test.ts"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/navigation-ia
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format navigation files
        run: >
          npx prettier --write
          src/App.vue
          src/components/shell/NavigationCommandPalette.vue
          src/components/shell/SidebarUtilityNav.vue
          src/domain/navigation.ts
          src/runtime/runtime.js
          tests/frontend/sidebar-startup.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue src/components/shell/NavigationCommandPalette.vue src/components/shell/SidebarUtilityNav.vue src/domain/navigation.ts src/runtime/runtime.js tests/frontend/sidebar-startup.test.ts
          git commit -m "Format navigation files"
          git push origin HEAD:feature/navigation-ia

# trigger formatter after workflow registration
