name: PR584 Prettier Autofix

on:
  push:
    branches:
      - task/frontend-state-ownership-performance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/frontend-state-ownership-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Format PR files
        run: |
          ./web/node_modules/.bin/prettier --write \
            --config web/.prettierrc \
            --ignore-path .prettierignore \
            docs/FRONTEND_STATE_OWNERSHIP_MIGRATION.md \
            web/src/App.vue \
            web/src/components/LlmReviewWorkspace.vue \
            web/src/components/shell/LazyFeatureDialogHosts.vue \
            web/src/domain/corpusCache.ts \
            web/src/domain/recordsWorkspace.ts \
            web/src/domain/searchQuery.ts \
            web/src/domain/sharedBackup.ts \
            web/src/domain/sharedCompareLibrary.ts \
            web/src/domain/sharedWorkspacePersistence.ts \
            web/src/domain/shellStatusProjection.ts \
            web/src/features/compare/compareDraft.ts \
            web/src/features/research/researchComposerDraft.ts \
            web/src/views/DashboardView.vue \
            web/src/views/ResearchView.vue \
            web/src/views/SettingsView.vue \
            web/src/views/VectorStoresView.vue \
            web/tests/frontend/search-workspace.test.ts \
            web/tests/frontend/semantic-map-sources.test.ts \
            web/tests/frontend/sidebar-startup.test.ts
      - name: Commit formatting and remove one-shot workflow
        run: |
          git rm .github/workflows/pr584-prettier-autofix.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format frontend state ownership changes"
          git push origin HEAD:task/frontend-state-ownership-performance
