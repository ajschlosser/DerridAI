name: Recover missing release tags

on:
  push:
    branches:
      - chore/release-metadata-repository-cleanup

permissions:
  contents: write

jobs:
  recover-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and push missing annotated tags
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Aaron Schlosser, PhD"
          git config user.email "aaron@aaronschlosser.com"

          create_release_tag() {
            local tag="$1"
            local target="$2"
            local version="$3"
            local message="$4"

            local actual_version
            actual_version="$(git show "$target:web/package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            if [[ "$actual_version" != "$version" ]]; then
              echo "::error::Refusing to tag $target as $tag: web/package.json declares $actual_version"
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag already exists on origin; leaving it unchanged."
              return
            fi

            git tag -a "$tag" "$target" -m "$message"
            git push origin "refs/tags/$tag"
          }

          create_release_tag "v0.80.6" "a4e4a543adf54c45252c4409be0a65ffecc8cb34" "0.80.6" "0.80.6 - Danvers"
          create_release_tag "v0.81.0" "91f12974cef29bdc2c60fac4aef1960bb0c26b5b" "0.81.0" "0.81.0 - Fall River"
