name: Refresh tooltip legacy snapshots

on:
  push:
    branches:
      - task/tooltips-help

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/tooltips-help
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build:ci
      - name: Refresh legacy DOM snapshots
        run: npm run test:e2e:legacy -- --update-snapshots
      - name: Commit refreshed snapshots
        shell: bash
        run: |
          if git diff --quiet -- tests/e2e/legacy-dom-baseline.spec.ts-snapshots; then
            echo "No snapshot changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/legacy-dom-baseline.spec.ts-snapshots
          git commit -m "Refresh tooltip legacy DOM snapshots"
          git push origin HEAD:task/tooltips-help
