name: Temporary research PR formatter
on:
  push:
    branches:
      - task/research-threads-workspace-ux
    paths:
      - .github/workflows/temporary-research-formatter.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Format only affected Vue files
        run: |
          ./web/node_modules/.bin/prettier --write --config web/.prettierrc \
            web/src/components/research/ResearchThreadAnswer.vue \
            web/src/components/research/ResearchThreadNavigation.vue
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/research/ResearchThreadAnswer.vue web/src/components/research/ResearchThreadNavigation.vue
          if ! git diff --cached --quiet; then
            git commit -m "style(research): format thread components with Prettier"
            git push
          fi
