# Temporary, read-only formatter diagnostic. Remove after applying its diff.
name: Research Workspace Format Diff
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - name: Print exact Vue format diff
        run: |
          ./web/node_modules/.bin/prettier --write \
            --config web/.prettierrc \
            web/src/views/ResearchView.vue
          git diff -- web/src/views/ResearchView.vue
