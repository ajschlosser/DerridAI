name: Native corpus CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/app/corpus_cli.py"
      - "api/app/corpus_cli_config.py"
      - "api/app/corpus_capabilities.py"
      - "api/app/corpus_run_config.py"
      - "api/app/pipelines/capabilities.py"
      - "api/app/corpus_binary_manifest.py"
      - "api/app/headless_corpus_runner.py"
      - "api/app/corpus_output_profiles.py"
      - "api/derridai_cli.py"
      - "api/requirements-cli-build.txt"
      - "scripts/build_cli_binary.py"
      - "scripts/smoke_cli_binary.py"
      - "scripts/smoke_cli_corpus.py"
      - "scripts/install-derridai.sh"
      - "scripts/install-derridai.ps1"
      - "tests/test_corpus_cli.py"
      - "tests/test_corpus_run_config.py"
      - "tests/test_pipeline_capabilities.py"
      - "tests/test_corpus_binary_manifest.py"
      - "tests/test_headless_corpus_runner.py"
      - "tests/test_corpus_output_profiles.py"
      - "docs/BINARY_PIPELINE_PLAN.md"
      - ".github/workflows/binary-cli.yml"
  push:
    branches: [master, "task/binary-pipeline-continuation"]
    paths:
      - "api/app/corpus_cli.py"
      - "api/app/corpus_cli_config.py"
      - "api/app/corpus_capabilities.py"
      - "api/app/corpus_run_config.py"
      - "api/app/pipelines/capabilities.py"
      - "api/app/corpus_binary_manifest.py"
      - "api/app/headless_corpus_runner.py"
      - "api/app/corpus_output_profiles.py"
      - "api/derridai_cli.py"
      - "api/requirements-cli-build.txt"
      - "scripts/build_cli_binary.py"
      - "scripts/smoke_cli_binary.py"
      - "scripts/smoke_cli_corpus.py"
      - "tests/test_corpus_cli.py"
      - "tests/test_corpus_run_config.py"
      - "tests/test_pipeline_capabilities.py"
      - "tests/test_corpus_binary_manifest.py"
      - "tests/test_headless_corpus_runner.py"
      - "tests/test_corpus_output_profiles.py"
      - ".github/workflows/binary-cli.yml"

concurrency:
  group: native-corpus-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Standalone ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: windows-2025
            target: windows-x86_64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-cli-build.txt

      - name: Install CLI build dependencies
        run: python -m pip install -r api/requirements-cli-build.txt

      - name: Run focused CLI tests
        run: >-
          python -m pytest -q
          tests/test_corpus_cli.py
          tests/test_corpus_run_config.py
          tests/test_pipeline_capabilities.py
          tests/test_corpus_binary_manifest.py
          tests/test_corpus_output_profiles.py
          tests/test_headless_corpus_runner.py

      - name: Compile standalone binary
        run: >-
          python scripts/build_cli_binary.py
          --target ${{ matrix.target }}
          --output-dir dist/cli/${{ matrix.target }}/standalone

      - name: Smoke test compiled binary
        run: >-
          python scripts/smoke_cli_binary.py
          --manifest
          dist/cli/${{ matrix.target }}/standalone/binary-manifest-${{ matrix.target }}-standalone.json

      - name: Build deterministic corpus through standalone binary
        run: >-
          python scripts/smoke_cli_corpus.py
          --manifest
          dist/cli/${{ matrix.target }}/standalone/binary-manifest-${{ matrix.target }}-standalone.json

      - name: Show binary manifest
        run: >-
          python -c "from pathlib import Path;
          print(Path(r'dist/cli/${{ matrix.target }}/standalone/binary-manifest-${{ matrix.target }}-standalone.json').read_text())"

      - name: Upload standalone distribution
        uses: actions/upload-artifact@v4
        with:
          name: derridai-${{ matrix.target }}-standalone
          path: dist/cli/${{ matrix.target }}/standalone
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Compile onefile binary
        run: >-
          python scripts/build_cli_binary.py
          --onefile
          --target ${{ matrix.target }}
          --output-dir dist/cli/${{ matrix.target }}/onefile

      - name: Smoke test onefile binary
        run: >-
          python scripts/smoke_cli_binary.py
          --manifest
          dist/cli/${{ matrix.target }}/onefile/binary-manifest-${{ matrix.target }}-onefile.json

      - name: Build deterministic corpus through onefile binary
        run: >-
          python scripts/smoke_cli_corpus.py
          --manifest
          dist/cli/${{ matrix.target }}/onefile/binary-manifest-${{ matrix.target }}-onefile.json

      - name: Show onefile manifest and size
        run: >-
          python -c "import json;
          from pathlib import Path;
          p=Path(r'dist/cli/${{ matrix.target }}/onefile/binary-manifest-${{ matrix.target }}-onefile.json');
          d=json.loads(p.read_text());
          print(p.read_text());
          print(f'onefile_size_bytes={d[\"size_bytes\"]}')"

      - name: Upload onefile release candidate
        uses: actions/upload-artifact@v4
        with:
          name: derridai-${{ matrix.target }}-onefile
          path: dist/cli/${{ matrix.target }}/onefile
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
