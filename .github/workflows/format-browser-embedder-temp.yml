name: Temporary browser embedder formatter

on:
  push:
    branches:
      - feature/browser-multilingual-embedder

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-multilingual-embedder
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format browser embedder changes
        run: |
          npx prettier --write \
            ../docs/BROWSER_EMBEDDINGS.md \
            scripts/browser-embedder-lib.mjs \
            scripts/browser-embedder-manifest.mjs \
            scripts/browser-embedder-runtime.mjs \
            scripts/build-browser-embedder.mjs \
            scripts/smoke-browser-embedder.mjs \
            tests/frontend/browserEmbedderBundle.test.ts
      - name: Commit formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BROWSER_EMBEDDINGS.md web/scripts web/tests/frontend/browserEmbedderBundle.test.ts
          git commit -m "Format browser embedder implementation"
          git push origin HEAD:feature/browser-multilingual-embedder
