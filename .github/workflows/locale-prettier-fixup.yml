# Temporary branch-only formatter helper; removed after it commits the exact pinned Prettier output.
name: Locale PR formatter fixup

on:
  push:
    branches:
      - feat/locale-browser-timezone-packs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/locale-browser-timezone-packs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Format PR-managed files
        shell: bash
        run: |
          git fetch origin master
          git diff --name-only --diff-filter=ACMRTUXB -z origin/master...HEAD -- \
            '*.md' '*.json' '*.yml' '*.yaml' '*.js' '*.mjs' '*.cjs' \
            '*.ts' '*.tsx' '*.vue' '*.css' '*.scss' '*.html' \
            | xargs -0 --no-run-if-empty ./web/node_modules/.bin/prettier \
              --write --config web/.prettierrc --ignore-path .prettierignore --ignore-unknown
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Locale and Latin pack changes"
          git push origin HEAD:feat/locale-browser-timezone-packs
