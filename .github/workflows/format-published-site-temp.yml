name: Temporary published-site formatter

on:
  push:
    branches:
      - feature/static-site-vue

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/static-site-vue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Format published-site sources
        working-directory: web
        run: |
          npx prettier --write --config .prettierrc \
            site \
            tsconfig.site.json \
            vite.site.config.ts
      - name: Commit formatted sources and remove temporary workflow
        run: |
          rm .github/workflows/format-published-site-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/site web/tsconfig.site.json web/vite.site.config.ts .github/workflows/format-published-site-temp.yml
          git commit -m "Format Vue published-site sources"
          git push origin HEAD:feature/static-site-vue
