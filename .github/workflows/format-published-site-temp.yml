name: Temporary published-site formatter

on:
  push:
    branches:
      - feature/static-site-vue

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Format published-site sources
        working-directory: web
        run: |
          npx prettier --write --config .prettierrc             site             tsconfig.site.json             vite.site.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-published-site
          path: |
            web/site
            web/tsconfig.site.json
            web/vite.site.config.ts
          if-no-files-found: error
          retention-days: 1
