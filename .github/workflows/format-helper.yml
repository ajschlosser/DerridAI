name: Format helper

on:
  push:
    branches:
      - feature/object-graph-explorer

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format changed frontend files
        run: |
          npx prettier --write             src/components/record/RecordInspector.vue             src/components/record/RecordTraceabilityExplorer.stories.ts             src/components/record/RecordTraceabilityExplorer.vue             src/views/RecordView.vue             tests/frontend/record-traceability-explorer.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-traceability-files
          path: |
            web/src/components/record/RecordInspector.vue
            web/src/components/record/RecordTraceabilityExplorer.stories.ts
            web/src/components/record/RecordTraceabilityExplorer.vue
            web/src/views/RecordView.vue
            web/tests/frontend/record-traceability-explorer.test.ts
