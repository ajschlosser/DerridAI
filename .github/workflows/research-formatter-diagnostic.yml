# Temporary diagnostics for formatting the Research UX patch.
# This workflow is removed after the formatter's exact diff has been applied.
name: Research formatter diagnostic
on:
  push:
    branches:
      - task/research-workspace-ux
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - name: Print Prettier's exact diff
        run: |
          ./web/node_modules/.bin/prettier --write \
            --config web/.prettierrc \
            web/src/components/research/ResearchAnswerContent.vue \
            web/src/components/research/researchAnswerFormatting.ts
          git diff -- web/src/components/research/ResearchAnswerContent.vue web/src/components/research/researchAnswerFormatting.ts
