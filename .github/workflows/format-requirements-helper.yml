name: Format requirements helper

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/requirements/**"
      - ".github/workflows/format-requirements-helper.yml"

permissions:
  contents: write

jobs:
  format-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: cd web && npm ci --no-audit --no-fund
      - name: Format requirements docs
        run: |
          ./web/node_modules/.bin/prettier --write docs/requirements/*.md \
            --config web/.prettierrc --ignore-path .prettierignore
      - name: Commit formatted requirements
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/requirements
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "style: format product requirements"
          git push origin HEAD:"$HEAD_BRANCH"
