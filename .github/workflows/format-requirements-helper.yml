name: Format requirements helper

on:
  pull_request:
    branches: [master]
    paths:
      - "docs/requirements/**"
      - ".github/workflows/format-requirements-helper.yml"

permissions:
  contents: read

jobs:
  format-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: cd web && npm ci --no-audit --no-fund
      - name: Format requirements docs
        run: |
          ./web/node_modules/.bin/prettier --write docs/requirements/*.md \
            --config web/.prettierrc --ignore-path .prettierignore
      - name: Upload formatted requirements
        uses: actions/upload-artifact@v4
        with:
          name: formatted-requirements
          path: docs/requirements
          if-no-files-found: error
