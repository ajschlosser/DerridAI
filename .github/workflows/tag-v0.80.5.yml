name: Tag v0.80.5

on:
  push:
    branches:
      - release/v0.80.5-tag

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac15972e49b90c531bfb756f1c624f69d2c29d1b
          fetch-depth: 0
      - name: Validate release target
        run: |
          test "$(git rev-parse HEAD)" = "ac15972e49b90c531bfb756f1c624f69d2c29d1b"
          grep -F 'APP_VERSION = "0.80.5"' api/app/config.py
          grep -F '"version": "0.80.5"' web/package.json
          grep -F '## 0.80.5 — Cambridge' CHANGELOG.md
          test -f docs/notes/0.80.5.md
      - name: Create annotated release tag
        run: |
          if git show-ref --verify --quiet refs/tags/v0.80.5; then
            echo "v0.80.5 already exists" >&2
            exit 1
          fi
          git config user.name "Aaron John Schlosser, PhD"
          git config user.email "ajschlosser@users.noreply.github.com"
          git tag -a v0.80.5 ac15972e49b90c531bfb756f1c624f69d2c29d1b -m "0.80.5 - Cambridge"
          git push origin refs/tags/v0.80.5
