# Temporary formatting diagnostic; removed after correction.
name: Research Plan Format Diff
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - name: Print exact plan formatting diff
        run: |
          ./web/node_modules/.bin/prettier --write --config web/.prettierrc \
            docs/RESEARCH_WORKSPACE_UX_IMPLEMENTATION_PLAN.md
          git diff -- docs/RESEARCH_WORKSPACE_UX_IMPLEMENTATION_PLAN.md
