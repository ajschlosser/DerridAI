services:
  web:
    build:
      context: ./web
      additional_contexts:
        gitmeta: ./.git
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8181}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # Opt-in frontend development server. Run with:
  #   docker compose --profile dev up storybook
  # The source bind mount provides live story edits while the anonymous
  # node_modules volume keeps container-installed dependencies available.
  storybook:
    build:
      context: ./web
      dockerfile: Dockerfile.storybook
    profiles: ["dev"]
    ports:
      - "${STORYBOOK_BIND:-127.0.0.1}:${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./web:/app
      - /app/node_modules
    restart: unless-stopped

  api:
    build:
      context: ./api
      additional_contexts:
        gitmeta: ./.git
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      HOME: /data/.home
      CHROMA_PATH: /data/chroma
      CHROMA_DATA_ROOT: /data
      AUTH_DB_PATH: ${AUTH_DB_PATH:-/data/.home/derridai-auth.sqlite3}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_LOCKOUT_SECONDS: ${AUTH_LOGIN_LOCKOUT_SECONDS:-300}
      SYSTEM_DB_PATH: ${SYSTEM_DB_PATH:-/data/.home/derridai-system.sqlite3}
      RESEARCHER_TEXT_MAX_CHARS: ${RESEARCHER_TEXT_MAX_CHARS:-1600}
      PDF_MAX_UPLOAD_MB: ${PDF_MAX_UPLOAD_MB:-500}
      ENRICHMENT_MAX_CONCURRENT_RUNS: ${ENRICHMENT_MAX_CONCURRENT_RUNS:-1}
      GRAPHQL_IDE_ENABLED: ${GRAPHQL_IDE_ENABLED:-false}
      GRAPHQL_INTROSPECTION_ENABLED: ${GRAPHQL_INTROSPECTION_ENABLED:-false}
      GRAPHQL_MAX_DEPTH: ${GRAPHQL_MAX_DEPTH:-8}
      GRAPHQL_MAX_ALIASES: ${GRAPHQL_MAX_ALIASES:-20}
      GRAPHQL_MAX_TOKENS: ${GRAPHQL_MAX_TOKENS:-2000}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_MAX_CLIENT_MESSAGE_BYTES: ${REALTIME_MAX_CLIENT_MESSAGE_BYTES:-65536}
      REALTIME_MAX_QUEUE_EVENTS: ${REALTIME_MAX_QUEUE_EVENTS:-256}
      REALTIME_REPLAY_EVENTS: ${REALTIME_REPLAY_EVENTS:-512}
      REALTIME_PROGRESS_MAX_HZ: ${REALTIME_PROGRESS_MAX_HZ:-8}
      REALTIME_HEARTBEAT_SECONDS: ${REALTIME_HEARTBEAT_SECONDS:-20}
      REALTIME_IDLE_TIMEOUT_SECONDS: ${REALTIME_IDLE_TIMEOUT_SECONDS:-60}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      CHROMA_MODE: ${CHROMA_MODE:-embedded}
      CHROMA_BASE_URL: ${CHROMA_BASE_URL:-http://chroma:8000}
      CHROMA_TOKEN: ${CHROMA_TOKEN:-}
      CHROMA_TENANT: ${CHROMA_TENANT:-default_tenant}
      CHROMA_DATABASE: ${CHROMA_DATABASE:-default_database}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3:latest}
      API_BATCH_SIZE: ${API_BATCH_SIZE:-128}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-8}
      OLLAMA_STATUS_TIMEOUT_SECONDS: ${OLLAMA_STATUS_TIMEOUT_SECONDS:-3}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-1800}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:3001/v1}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-auto}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_CONNECT_TIMEOUT_SECONDS: ${OPENAI_CONNECT_TIMEOUT_SECONDS:-10}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-1800}
      LLM_MAX_TEXT_CHARS: ${LLM_MAX_TEXT_CHARS:-50000}
      LLM_METADATA_NUM_PREDICT: ${LLM_METADATA_NUM_PREDICT:-768}
      LLM_TEXT_NUM_PREDICT: ${LLM_TEXT_NUM_PREDICT:-4096}
      LLM_MAX_FIELDS: ${LLM_MAX_FIELDS:-12}
      RAG_DEFAULT_K: ${RAG_DEFAULT_K:-64}
      RAG_DEFAULT_FETCH_K: ${RAG_DEFAULT_FETCH_K:-500}
      RAG_DEFAULT_RERANK_TOP_N: ${RAG_DEFAULT_RERANK_TOP_N:-24}
      RAG_DEFAULT_LAMBDA_MULT: ${RAG_DEFAULT_LAMBDA_MULT:-0.7}
      RAG_DEFAULT_RRF_K: ${RAG_DEFAULT_RRF_K:-60}
      RAG_DEFAULT_QUERY_NUM_PREDICT: ${RAG_DEFAULT_QUERY_NUM_PREDICT:-768}
      RAG_DEFAULT_RECORD_CHAR_LIMIT: ${RAG_DEFAULT_RECORD_CHAR_LIMIT:-12000}
      RAG_DEFAULT_TOTAL_CHAR_LIMIT: ${RAG_DEFAULT_TOTAL_CHAR_LIMIT:-120000}
      RAG_OLLAMA_MAX_CONCURRENT: ${RAG_OLLAMA_MAX_CONCURRENT:-1}
      RAG_AUTO_GRADE_MAX_ATTEMPTS: ${RAG_AUTO_GRADE_MAX_ATTEMPTS:-2}
      RAG_AUTO_GRADE_RETRY_DELAY_SECONDS: ${RAG_AUTO_GRADE_RETRY_DELAY_SECONDS:-1.5}
      RAG_CROSS_ENCODER_MODEL: ${RAG_CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RAG_MODEL_CACHE: ${RAG_MODEL_CACHE:-/data/models}
      DOCUMENT_NLP_BASE_URL: ${DOCUMENT_NLP_BASE_URL:-}
      DOCUMENT_NLP_TIMEOUT_SECONDS: ${DOCUMENT_NLP_TIMEOUT_SECONDS:-900}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Optional whole-document BookNLP analyzer.  Model artifacts are mounted
  # read-only and must be supplied explicitly; the worker never downloads weights
  # at runtime. Enable with --profile document-nlp and set
  # DOCUMENT_NLP_BASE_URL=http://document-nlp:8090 on the API process.
  document-nlp:
    build:
      context: ./booknlp-worker
    profiles: ["document-nlp"]
    environment:
      BOOKNLP_ENTITY_MODEL: ${BOOKNLP_ENTITY_MODEL:-}
      BOOKNLP_COREF_MODEL: ${BOOKNLP_COREF_MODEL:-}
      BOOKNLP_QUOTE_MODEL: ${BOOKNLP_QUOTE_MODEL:-}
      BOOKNLP_SPACY_MODEL: ${BOOKNLP_SPACY_MODEL:-en_core_web_sm}
    volumes:
      - ./data/models/booknlp:/models/booknlp:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)); raise SystemExit(0 if d.get('ready') else 1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    gpus: all
    restart: unless-stopped

  # Opt-in Chroma server. Run with:
  #   docker compose --profile chroma up -d
  # then set CHROMA_MODE=http and CHROMA_BASE_URL=http://chroma:8000.
  # Do not point PersistentClient and this service at the same directory.
  chroma:
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-1.1.0}
    profiles: ["chroma"]
    ports:
      - "${CHROMA_BIND:-127.0.0.1}:${CHROMA_PORT:-8001}:8000"
    volumes:
      - ./data/chroma-server:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
